name: CI

# Roda em todo pull request e a cada push em main/staging. Três jobs em paralelo:
#   1. Deno     — lint, checagem de tipos e testes unitários/propriedades das Edge Functions
#   2. Mobile   — lint, tipos, testes Jest (com cobertura) e auditoria de dependências
#   3. Supabase — sobe o stack local do zero (todas as migrations), roda os testes
#                 pgTAP do banco e as suítes de integração, segurança, concorrência e fuzzing
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno:
    name: Deno · lint, tipos e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint supabase/

      - name: Checagem de tipos
        run: >
          deno check
          supabase/functions/*/index.ts
          supabase/functions/tests/*.ts
          supabase/tests/*.ts
          supabase/scripts/*.ts

      - name: Testes unitários e de propriedades (com cobertura)
        working-directory: supabase/functions
        run: deno test --coverage=../../coverage-deno tests/

      - name: Relatório de cobertura
        if: always()
        run: |
          deno coverage coverage-deno --include=supabase/functions/_shared --lcov --output=coverage-deno.lcov
          {
            echo '### Cobertura — supabase/functions/_shared'
            echo '```'
            deno coverage coverage-deno --include=supabase/functions/_shared
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-deno
          path: coverage-deno.lcov
          retention-days: 14

  mobile:
    name: Mobile · lint, tipos, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint / eslint-config-expo)
        run: pnpm lint

      - name: Checagem de tipos
        run: pnpm exec tsc --noEmit

      - name: Testes Jest com cobertura
        run: pnpm test:coverage --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary

      - name: Resumo da cobertura
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"]
              .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            console.log(["### Cobertura — mobile", "| métrica | % | cobertos |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-mobile
          path: mobile/coverage/lcov.info
          retention-days: 14

      - name: Auditoria de dependências (falha em vulnerabilidade alta ou crítica)
        run: pnpm audit --prod --audit-level high

  supabase:
    name: Supabase · banco, integração, segurança, concorrência e fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sobe o Supabase local aplicando todas as migrations do zero
        # Serviços que os testes não usam ficam de fora para acelerar.
        run: supabase start -x studio,imgproxy,realtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Lint do PL/pgSQL (plpgsql_check)
        run: supabase db lint --level warning --fail-on warning

      - name: Testes de banco (pgTAP)
        run: supabase test db

      - name: Serve as Edge Functions (VISION_PROVIDER=mock)
        run: |
          supabase functions serve --env-file supabase/functions/.env.example > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/join-store || true)
            [ "$code" = "200" ] && echo "Edge Functions prontas" && exit 0
            sleep 2
          done
          echo "::error::Edge Functions não responderam"; cat functions.log; exit 1

      - name: Exporta URL e chaves do stack local
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/"//g' > status.env
          {
            echo "SUPABASE_URL=$(grep ^API_URL= status.env | cut -d= -f2-)"
            echo "SUPABASE_ANON_KEY=$(grep ^ANON_KEY= status.env | cut -d= -f2-)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep ^SERVICE_ROLE_KEY= status.env | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
          rm status.env

      - name: Integração (fluxo completo ponta a ponta)
        run: deno test -A supabase/tests/integration.test.ts

      - name: Segurança (pentest automatizado — OWASP API Top 10)
        run: deno test -A supabase/tests/security.test.ts

      - name: Concorrência (condições de corrida)
        run: deno test -A supabase/tests/concurrency.test.ts

      - name: Fuzzing da API
        env:
          FUZZ_RUNS: 300
        run: deno test -A supabase/tests/fuzz.test.ts

      - name: Log das Edge Functions
        if: failure()
        run: cat functions.log

      - name: Para o Supabase
        if: always()
        run: supabase stop --no-backup
