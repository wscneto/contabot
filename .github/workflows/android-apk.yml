name: APK Android

# Gera o APK sempre que algo do app entra na main (merge de PR = push na main).
# Também pode ser disparado manualmente na aba Actions.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Se dois merges chegarem em sequência, só o mais recente é compilado.
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write # necessário para publicar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Valores embutidos no bundle JS no momento do build (veja mobile/.env.example).
      # Precisam apontar para o Supabase em nuvem — 127.0.0.1 não funciona no celular.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_MAX_VIDEO_SECONDS: ${{ vars.EXPO_PUBLIC_MAX_VIDEO_SECONDS }}

    steps:
      - uses: actions/checkout@v5

      - name: Confere variáveis do Supabase
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Defina os secrets EXPO_PUBLIC_SUPABASE_URL e EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Gera o projeto Android (prebuild)
        run: pnpm expo prebuild --platform android --no-install

      - name: Define versionCode a partir do número do build
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Compila o APK de release
        working-directory: mobile/android
        # Apenas ARM (celulares reais); deixa de fora x86 de emulador para acelerar o build.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomeia o APK
        id: apk
        run: |
          name="contabot-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "path=mobile/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: contabot-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publica Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
