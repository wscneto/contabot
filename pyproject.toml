[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contabot"
version = "0.2.0"
description = "Piloto de contagem visual de estoque com revisão humana"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1.0,<2",
  "opencv-python-headless>=4.11,<5", "numpy>=2,<3", "pillow>=11,<13",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.setuptools.packages.find]
include = ["contabot", "contabot.*", "scripts"]

[tool.setuptools.package-data]
contabot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
